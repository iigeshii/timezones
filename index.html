<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crimson Cuckoo Coven — Time Zone Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-header">
    <h1>Crimson Cuckoo Coven</h1>
    <div class="chip">
      <span class="chip-dot"></span>
      <span id="localTzLabel"></span>
      <span class="chip-sep">·</span>
      <span id="localNow" class="highlight"></span>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="current">Current Times</button>
    <button class="tab-btn" data-tab="announce">Announcement</button>
  </div>

  <!-- ── Tab: Current Times ── -->
  <div class="tab-panel" id="panel-current">
    <div class="tl-date-nav">
      <button class="icon-btn" id="tlPrevDay">&#8249;</button>
      <span id="tlDateLabel" class="tl-date-label"></span>
      <button class="icon-btn" id="tlNextDay">&#8250;</button>
      <button class="icon-btn today-btn" id="tlToday">Today</button>
      <span class="tl-toggle-hint">Drag columns to select a time · Click a name to hide/show</span>
    </div>

    <!-- Selection bar — appears when columns are selected -->
    <div id="selectionBar" class="sel-bar" style="display:none;">
      <span id="selectionLabel" class="sel-bar-label"></span>
      <button id="btnAnnounceFromSel" class="sel-bar-announce"></button>
      <button id="btnClearSel" class="sel-bar-clear" title="Clear selection">✕</button>
    </div>

    <div class="card tl-card">
      <div class="tl-scroll-wrapper" id="tlScrollWrapper">
        <table class="tl-table" id="tlTable">
          <thead id="tlHead"></thead>
          <tbody id="tlBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Tab: Announcement ── -->
  <div class="tab-panel" id="panel-announce" style="display:none;">

    <div id="announceContent" style="display:none;">
      <div class="card">
        <div class="card-title" id="announceTitle">Event Announcement</div>
        <div class="controls" style="margin-top:0.75rem;">
          <div class="control-group">
            <label>Event name</label>
            <input id="eventTitle" type="text" placeholder="e.g. Raid Night" style="max-width:300px;" />
          </div>
          <div class="control-group">
            <label>Time (UTC)</label>
            <div id="announceUtc" class="highlight" style="margin-top:0.2rem;"></div>
          </div>
          <div class="control-group" style="min-width:220px;">
            <label>Share</label>
            <div class="quick-buttons">
              <button id="copyAnnounceImage" class="quick-button">Copy image</button>
              <button id="downloadAnnounceImage" class="quick-button">Download PNG</button>
            </div>
            <div class="small-note">Copy works best on HTTPS. Download works everywhere.</div>
          </div>
        </div>
      </div>

      <div id="announcePosterCompact" class="card poster poster-compact">
        <div class="poster-header">
          <div>
            <div class="card-title" id="announcePosterTitleCompact">Event Announcement</div>
            <div class="small-note" id="announcePosterUtcLineCompact"></div>
          </div>
          <div class="chip">
            <span class="chip-dot"></span>
            <span>Crimson Cuckoo Coven</span>
          </div>
        </div>
        <div class="compact-grid" id="announceGrid"></div>
      </div>
    </div>

    <div id="announceEmpty" class="card announce-empty">
      <div class="announce-empty-icon">📅</div>
      <div class="announce-empty-title">No announcement yet</div>
      <div class="small-note">Go to <strong>Current Times</strong>, drag to select time columns, then click <strong>→ Announce</strong>.</div>
    </div>

  </div>

  <script>
    // ── Members ──
    const members = [
      { name: "GeshGiezel",                timeZone: "America/Phoenix" },
      { name: "The Auld Witch / Poppie",   timeZone: "Europe/London" },
      { name: "Fredo / Bomberbird248",     timeZone: "Europe/Berlin" },
      { name: "Skullman",                  timeZone: "Europe/London" },
      { name: "Kaiusz / KVG89",            timeZone: "Europe/Amsterdam" },
      { name: "Cloud / DiabolicalCloud",   timeZone: "America/Regina" },
      { name: "Emsi1y2255",                timeZone: "America/Chicago" },
      { name: "Kitty / porcelaingamer8",   timeZone: "America/New_York" },
      { name: "Hitesh / Hitesh2550",       timeZone: "Asia/Kolkata" },
      { name: "Tala / Aikois",             timeZone: "Asia/Manila" },
      { name: "Flameboi789 / Flame7484",   timeZone: "America/Los_Angeles" },
      { name: "zet / SvelteAtom2577",      timeZone: "Europe/Berlin" },
      { name: "Suwa / Suwa7506",           timeZone: "Asia/Kolkata" },
      { name: "Lil Roony / Lil Roony woo", timeZone: "Asia/Kolkata" },
      { name: "LadyVonDawn",              timeZone: "Asia/Manila" },
    ];

    const localTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // ── Tabs ──
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
      document.getElementById(`panel-${id}`).style.display = 'block';
    }

    // ── Formatters ──
    function dualFormatNoSeconds(date, timeZone) {
      if (!date) return "—";
      const f24 = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit",
        hour12: false, weekday: "short", month: "short", day: "2-digit", timeZone,
      }).format(date);
      const f12 = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit", hour12: true, timeZone,
      }).format(date);
      return `${f24}<br><span class="twelve-hour">${f12}</span>`;
    }

    function getZoneLabel(timeZone) {
      const now = new Date();
      const short = new Intl.DateTimeFormat("en-US", { timeZone, hour: "2-digit", minute: "2-digit", timeZoneName: "short" })
        .formatToParts(now).find(p => p.type === "timeZoneName")?.value || "";
      const offset = new Intl.DateTimeFormat("en-US", { timeZone, hour: "2-digit", minute: "2-digit", timeZoneName: "shortOffset" })
        .formatToParts(now).find(p => p.type === "timeZoneName")?.value?.replace("UTC", "GMT") || "";
      const preferred = {
        "Europe/Berlin": "CET", "Europe/Amsterdam": "CET", "Europe/London": "BST",
        "America/Phoenix": "MST", "America/Chicago": "CDT", "America/New_York": "EDT",
        "America/Regina": "CST", "Asia/Kolkata": "IST", "Asia/Manila": "PHT",
        "America/Los_Angeles": "PDT", "UTC": "UTC",
      };
      let abbr = short;
      if ((abbr === offset || abbr === "") && preferred[timeZone]) abbr = preferred[timeZone];
      return (abbr === offset || abbr === "") ? offset : `${abbr} / ${offset}`;
    }

    function getLocalHourForUtcDate(utcDate, timeZone) {
      return new Date(utcDate.toLocaleString("en-US", { timeZone })).getHours();
    }

    function classifyHour(h) {
      if (h >= 9 && h < 22) return "good";
      if ((h >= 7 && h < 9) || (h >= 22 && h < 24)) return "okay";
      return "bad";
    }
    function getSlotClass(h) { return `slot-${classifyHour(h)}`; }

    function getUtcOffsetMs(tz) {
      const now = new Date();
      return new Date(now.toLocaleString("en-US", { timeZone: tz })) - now;
    }
    function getUtcDayStart(date) {
      return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
    }

    function sortByLocalTime(date) {
      return [...members].sort((a, b) => {
        const ts = tz => new Date(date.toLocaleString("en-US", { timeZone: tz })).getTime();
        return ts(b.timeZone) - ts(a.timeZone);
      });
    }

    // ── Member visibility toggle ──
    let disabledMembers = new Set(JSON.parse(localStorage.getItem('ccc-disabled') || '[]'));

    function toggleMember(name) {
      if (disabledMembers.has(name)) disabledMembers.delete(name);
      else disabledMembers.add(name);
      localStorage.setItem('ccc-disabled', JSON.stringify([...disabledMembers]));
      const w = document.getElementById('tlScrollWrapper');
      const s = w.scrollLeft;
      renderTimeline();
      w.scrollLeft = s;
      applySelectionClasses();
    }

    function sortByOffset() {
      const byOffset = (a, b) => getUtcOffsetMs(b.timeZone) - getUtcOffsetMs(a.timeZone);
      const active   = members.filter(m => !disabledMembers.has(m.name)).sort(byOffset);
      const disabled = members.filter(m =>  disabledMembers.has(m.name)).sort(byOffset);
      return { active, disabled };
    }

    // ── Local time chip ──
    document.getElementById('localTzLabel').textContent = localTimeZone;

    function updateLocalNow() {
      document.getElementById('localNow').textContent = new Intl.DateTimeFormat("en-US", {
        hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true, timeZone: localTimeZone,
      }).format(new Date());
    }

    // ── Column selection ──
    let selStart = null, selEnd = null, isDragging = false, dragAnchor = null;

    function getColFromEl(el) {
      const cell = el?.closest('[data-col]');
      return cell ? parseInt(cell.dataset.col) : null;
    }

    function setSelection(a, b) {
      selStart = Math.min(a, b);
      selEnd   = Math.max(a, b);
      applySelectionClasses();
      updateSelectionBar();
    }

    function clearSelection() {
      selStart = selEnd = dragAnchor = null;
      applySelectionClasses();
      updateSelectionBar();
    }

    function applySelectionClasses() {
      document.querySelectorAll('[data-col]').forEach(el => {
        const c = parseInt(el.dataset.col);
        const inSel = selStart !== null && c >= selStart && c <= selEnd;
        el.classList.toggle('tl-selected',  inSel);
        el.classList.toggle('tl-sel-first', inSel && c === selStart);
        el.classList.toggle('tl-sel-last',  inSel && c === selEnd);
      });
    }

    function updateSelectionBar() {
      const bar = document.getElementById('selectionBar');
      if (selStart === null) { bar.style.display = 'none'; return; }

      const dayStart = getUtcDayStart(tlViewDate);
      const dateStr = dayStart.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC',
      });
      const s = `${String(selStart).padStart(2,'0')}:00`;
      const e = `${String(selEnd).padStart(2,'0')}:00`;
      const rangeStr = selStart === selEnd ? `${s} UTC` : `${s}–${e} UTC`;

      document.getElementById('selectionLabel').textContent = `${dateStr} · ${rangeStr}`;
      document.getElementById('btnAnnounceFromSel').textContent = `→ Announce at ${s} UTC`;
      bar.style.display = 'flex';
    }

    // Mouse/touch events for column drag-select
    const tlTable = document.getElementById('tlTable');

    tlTable.addEventListener('mousedown', e => {
      const col = getColFromEl(e.target);
      if (col === null) return;
      isDragging = true;
      dragAnchor = col;
      setSelection(col, col);
      e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const col = getColFromEl(el);
      if (col !== null) setSelection(dragAnchor, col);
    });

    document.addEventListener('mouseup', () => { isDragging = false; });

    // Click outside timeline + selection bar clears selection
    document.addEventListener('click', e => {
      if (!e.target.closest('#tlTable') && !e.target.closest('#selectionBar')) clearSelection();
    });

    document.getElementById('btnClearSel').addEventListener('click', () => clearSelection());

    document.getElementById('btnAnnounceFromSel').addEventListener('click', () => {
      if (selStart === null) return;
      const dayStart = getUtcDayStart(tlViewDate);
      const utcDate = new Date(Date.UTC(
        dayStart.getUTCFullYear(), dayStart.getUTCMonth(), dayStart.getUTCDate(), selStart, 0, 0
      ));
      switchTab('announce');
      renderAnnouncement(utcDate);

      const params = new URLSearchParams();
      params.set('announce', '1');
      params.set('time', utcDate.toISOString());
      const title = document.getElementById('eventTitle').value.trim();
      if (title) params.set('title', title);
      history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
    });

    // ── Timeline ──
    let tlViewDate = new Date();
    let tlFirstRender = true;
    let tlLastHour = -1;

    function renderTimeline() {
      const dayStart = getUtcDayStart(tlViewDate);
      const now = new Date();
      const isToday = dayStart.getTime() === getUtcDayStart(now).getTime();
      const currentUtcHour = now.getUTCHours();

      document.getElementById('tlDateLabel').textContent = dayStart.toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC',
      });

      // Header
      let head = '<tr><th class="tl-name-th">Member</th>';
      for (let h = 0; h < 24; h++) {
        const cur = isToday && h === currentUtcHour;
        head += `<th class="tl-hour-th${cur ? ' tl-cur' : ''}" data-col="${h}">${h}<span class="tl-utc-sub">UTC</span></th>`;
      }
      head += '</tr>';
      document.getElementById('tlHead').innerHTML = head;

      // Rows
      const { active, disabled } = sortByOffset();
      let body = '';

      function buildRow(m, isDisabled) {
        const hour0 = new Date(Date.UTC(dayStart.getUTCFullYear(), dayStart.getUTCMonth(), dayStart.getUTCDate(), 0, 0, 0));
        const baseDay = new Date(hour0.toLocaleString("en-US", { timeZone: m.timeZone })).getDate();
        const localNow = new Date(now.toLocaleString("en-US", { timeZone: m.timeZone }));
        const lh = localNow.getHours(), lm = localNow.getMinutes();
        const lh12 = lh % 12 || 12, lap = lh < 12 ? 'am' : 'pm';
        const title = isDisabled ? 'Click to show' : 'Click to hide';

        let row = `<tr class="${isDisabled ? 'tl-row-disabled' : ''}">
          <td class="tl-name-cell" data-member="${m.name.replace(/"/g,'&quot;')}" title="${title}">
            <div class="tl-member-name">${m.name}</div>
            <div class="tl-tz-label">${getZoneLabel(m.timeZone)}</div>
            ${isToday ? `<div class="tl-live-time" data-tz="${m.timeZone}">${lh12}:${String(lm).padStart(2,'0')} ${lap}</div>` : ''}
          </td>`;

        let prevDay = baseDay;
        for (let h = 0; h < 24; h++) {
          const utcMoment = new Date(Date.UTC(dayStart.getUTCFullYear(), dayStart.getUTCMonth(), dayStart.getUTCDate(), h, 0, 0));
          const localMoment = new Date(utcMoment.toLocaleString("en-US", { timeZone: m.timeZone }));
          const localHour = localMoment.getHours();
          const localDay = localMoment.getDate();
          const h12 = localHour % 12 || 12, ap = localHour < 12 ? 'am' : 'pm';
          const slotCls = isDisabled ? 'slot-hidden' : getSlotClass(localHour);
          const cur = isToday && h === currentUtcHour;
          const dayChanged = localDay !== prevDay;
          prevDay = localDay;

          row += `<td class="tl-cell ${slotCls}${cur ? ' tl-cur' : ''}" data-col="${h}">
            ${dayChanged ? `<div class="tl-day-badge">${localMoment.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:m.timeZone})}</div>` : ''}
            <div class="tl-hr">${h12}</div>
            <div class="tl-ap">${ap}</div>
          </td>`;
        }
        return row + '</tr>';
      }

      active.forEach(m => { body += buildRow(m, false); });
      if (disabled.length) {
        body += `<tr class="tl-separator"><td class="tl-sep-cell" colspan="25">Hidden members — click to restore</td></tr>`;
        disabled.forEach(m => { body += buildRow(m, true); });
      }

      document.getElementById('tlBody').innerHTML = body;
      applySelectionClasses();

      if (tlFirstRender && isToday) {
        tlFirstRender = false;
        requestAnimationFrame(() => {
          const w = document.getElementById('tlScrollWrapper');
          const cellW = 54, nameW = 185;
          w.scrollLeft = Math.max(0, nameW + currentUtcHour * cellW - w.clientWidth / 2 + cellW / 2);
        });
      }
    }

    function updateLiveTimes() {
      const now = new Date();
      document.querySelectorAll('.tl-live-time[data-tz]').forEach(el => {
        const local = new Date(now.toLocaleString("en-US", { timeZone: el.dataset.tz }));
        const lh = local.getHours(), lm = local.getMinutes();
        const h12 = lh % 12 || 12, ap = lh < 12 ? 'am' : 'pm';
        el.textContent = `${h12}:${String(lm).padStart(2,'0')} ${ap}`;
      });
    }

    // Member name click toggle (delegation)
    document.getElementById('tlBody').addEventListener('click', e => {
      const cell = e.target.closest('.tl-name-cell[data-member]');
      if (!cell) return;
      toggleMember(cell.dataset.member);
    });

    // Day nav
    document.getElementById('tlPrevDay').addEventListener('click', () => {
      tlViewDate = new Date(tlViewDate.getTime() - 86400000);
      clearSelection();
      renderTimeline();
    });
    document.getElementById('tlNextDay').addEventListener('click', () => {
      tlViewDate = new Date(tlViewDate.getTime() + 86400000);
      clearSelection();
      renderTimeline();
    });
    document.getElementById('tlToday').addEventListener('click', () => {
      tlViewDate = new Date();
      tlFirstRender = true;
      clearSelection();
      renderTimeline();
    });

    // ── Announcement ──
    let currentAnnounceUtc = null;

    function renderAnnouncement(utcDate) {
      currentAnnounceUtc = utcDate;
      const title = (document.getElementById('eventTitle').value.trim() || getParam('title') || 'Event Announcement');
      updatePosterTitle(title);

      const utcPretty = dualFormatNoSeconds(utcDate, "UTC");
      document.getElementById('announceUtc').innerHTML = utcPretty;
      document.getElementById('announcePosterUtcLineCompact').innerHTML = `UTC: <span class="highlight">${utcPretty}</span>`;

      const grid = document.getElementById('announceGrid');
      grid.innerHTML = '';
      sortByLocalTime(new Date()).forEach(m => {
        const h = getLocalHourForUtcDate(utcDate, m.timeZone);
        const item = document.createElement('div');
        item.className = `compact-item ${getSlotClass(h)}`;
        item.innerHTML = `<div class="compact-name">${m.name}</div><div class="compact-time">${dualFormatNoSeconds(utcDate, m.timeZone)}</div>`;
        grid.appendChild(item);
      });

      document.getElementById('announceContent').style.display = 'block';
      document.getElementById('announceEmpty').style.display = 'none';
    }

    function updatePosterTitle(title) {
      const t = title || 'Event Announcement';
      document.getElementById('announceTitle').textContent = t;
      document.getElementById('announcePosterTitleCompact').textContent = t;
    }

    // Live title update
    document.getElementById('eventTitle').addEventListener('input', e => {
      updatePosterTitle(e.target.value.trim());
      if (currentAnnounceUtc) updateURLParams();
    });

    async function posterToCanvas() {
      const el = document.getElementById('announcePosterCompact');
      const prev = el.style.display;
      el.style.display = 'block';
      const canvas = await html2canvas(el, { backgroundColor: null, scale: 2, useCORS: true });
      el.style.display = prev;
      return canvas;
    }

    document.getElementById("copyAnnounceImage").addEventListener("click", async () => {
      try {
        const blob = await new Promise(res => posterToCanvas().then(c => c.toBlob(res, "image/png")));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      } catch { alert("Copy failed (requires HTTPS). Use Download PNG instead."); }
    });

    document.getElementById("downloadAnnounceImage").addEventListener("click", async () => {
      const canvas = await posterToCanvas();
      const a = document.createElement("a");
      a.download = "event-announcement.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });

    // ── URL params ──
    function getParam(name) { return new URLSearchParams(window.location.search).get(name); }

    function updateURLParams() {
      if (!currentAnnounceUtc) return;
      const params = new URLSearchParams();
      params.set('announce', '1');
      params.set('time', currentAnnounceUtc.toISOString());
      const title = document.getElementById('eventTitle').value.trim();
      if (title) params.set('title', title);
      history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
    }

    function loadFromURLParams() {
      const ann = getParam('announce');
      if (ann === '1' || ann === 'true') {
        const t = getParam('time');
        if (t) {
          const d = new Date(t);
          if (!isNaN(d)) {
            const title = getParam('title');
            if (title) document.getElementById('eventTitle').value = title;
            switchTab('announce');
            renderAnnouncement(d);
            return;
          }
        }
      }
    }

    // ── Init ──
    renderTimeline();
    updateLocalNow();
    loadFromURLParams();

    setInterval(() => {
      updateLocalNow();
      const now = new Date();
      const isViewingToday = getUtcDayStart(tlViewDate).getTime() === getUtcDayStart(now).getTime();
      if (!isViewingToday) return;
      const h = now.getUTCHours();
      if (h !== tlLastHour) {
        tlLastHour = h;
        const w = document.getElementById('tlScrollWrapper');
        const s = w.scrollLeft;
        renderTimeline();
        w.scrollLeft = s;
      } else {
        updateLiveTimes();
      }
    }, 1000);
  </script>
</body>
</html>
